# ABOUTME: Builds the memorial page from transcript.md and publishes it to GitHub Pages.
# ABOUTME: Runs on every push to main; the Cleaned audio is committed, so no audio processing happens here.
name: Publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        run: |
          python scripts/build.py transcript.md page/template.html site/index.html data/whisper.json data/whisper-closing.json
          cp audio/cleaned.m4a site/audio.m4a
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
